[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-orchestrator"
version = "0.1.0"
description = "Safely orchestrate GRIB ingestion, validated Zarr conversion, publication, and retention"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vyacheslav Semenov", email = "mantesum@projecteol.ru" }]
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0.2",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
forecast-orchestrator = "forecast_orchestrator.cli:app"

[project.urls]
Repository = "https://github.com/Mantesum/forecast-orchestrator"
Issues = "https://github.com/Mantesum/forecast-orchestrator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_orchestrator"]
artifacts = ["src/forecast_orchestrator/py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".uv-cache",
  ".uv-python",
  ".venv",
  ".pytest-tmp-*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forecast_orchestrator"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
